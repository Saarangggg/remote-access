name: remoteconnect
description: RemoteConnect - Control your desktop from your phone
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  socket_io_client: ^2.0.3+1
  dio: ^5.4.3+1

  # Navigation
  go_router: ^13.2.5

  # Storage
  shared_preferences: ^2.2.3

  # File Operations
  file_picker: ^8.0.5
  path_provider: ^2.1.3
  open_filex: ^4.5.0

  # Permissions
  permission_handler: ^11.3.1

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.1

  # UI / UX
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  percent_indicator: ^4.2.3
  lottie: ^3.1.2

  # Notifications (in-app)
  flutter_local_notifications: ^17.1.2

  # Utils
  intl: ^0.19.0
  collection: ^1.18.0
  uuid: ^4.4.0
  mime: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.3

flutter:
  uses-material-design: true
